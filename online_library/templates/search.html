{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Search Books - BookNest Library</title>
    <link rel="stylesheet" href="{% static 'search style.css' %}">
</head>
<body>

    <!-- Navigation Bar -->
<nav>
    <h2 class="logo">📚 BookNest Library</h2>
    
    <ul>
 
    <a class="nav-link" href="{% url 'user_home' %}"><li>Home</li></a> 
    <a class="nav-link" href="{% url 'search' %}"><li>Search Books</li></a> 
    <a class="nav-link" href="{% url 'borrowed_books' %}"><li>Borrowed Books</li></a> 
    <a class="nav-link out" href="#" onclick="logout()">Logout</a>
  </ul>
    <hr>
</nav>

    <!-- Page Title -->
    <h2>🔍 Search for Books</h2>

    <!-- Alert Area -->
    <div id="alertMessage" class="alert"></div>

    <!-- Search Form -->
    <form id="searchForm">
        <label>Search by Title, Author, or Category:</label><br>
        <input type="text" id="searchInput" placeholder="Enter your search..."><br>

        <label>
            <input type="radio" name="search_by" checked> All
        </label>
        <label>
            <input type="radio" name="search_by"> Title
        </label>
        <label>
            <input type="radio" name="search_by"> Author
        </label>
        <label>
            <input type="radio" name="search_by"> Category
        </label>

        <br>
        <button type="submit">🔎 Search</button>
    </form>

    <!-- Results Section -->
    <h3>Search Results:</h3>
    <div id="searchStats"></div>
    <div id="resultsContainer" class="results-container"></div>

    <!-- Search History -->
    <div class="search-history">
        <h4>📜 Recent Searches</h4>
        <div id="historyList"></div>
    </div>

    <!-- Bottom Links -->
    <div class="bottom-links">
        <a href="{% url 'borrowed_books' %}">📖 View My Borrowed Books</a>
        <br><br>
        <a href="{% url 'login' %}">🚪 Logout</a>
    </div>

    <script src="{% static 'search.js' %}?v=2"></script>
<script src="{% static 'authScript.js' %}"></script>
</body>
</html>
