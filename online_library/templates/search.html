{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest Library - Search Books</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap');

:root {
    --bg-gradient: linear-gradient(135deg, #070a12 0%, #020408 100%);
    --glass-bg: rgba(255, 255, 255, 0.015);
    --glass-border: rgba(255, 255, 255, 0.05);
    
    --primary-glow: #059669;    /* الزمردي الموحد للمستخدم */
    --secondary-glow: #fbbf24;  /* الذهبي السيبراني */
    --alert-blue: #3b82f6;
    
    --text-main: #f3f4f6;
    --text-muted: #6b7280;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'JetBrains Mono', monospace;
}

body {
    background: var(--bg-gradient);
    color: var(--text-main);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}

/* ==========================================================================
   الـ Navbar الفاخر والموحد للموقع
   ========================================================================== */
.glass-nav {
    position: fixed;
    top: 25px; left: 50%;
    transform: translateX(-50%);
    width: 92%; max-width: 1200px;
    background: rgba(3, 7, 18, 0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 18px 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}

.logo {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -1px;
    color: #fff;
}
.brand-accent {
    color: var(--secondary-glow);
    text-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
}

.nav-menu {
    display: flex;
    align-items: center;
    list-style: none;
    gap: 15px;
}

.nav-link {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    transition: all 0.3s ease;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid transparent;
}
.nav-link:hover, .nav-link.active {
    color: var(--primary-glow);
    background: rgba(5, 150, 105, 0.05);
    border-color: rgba(5, 150, 105, 0.2);
}

.logout-btn {
    background: transparent;
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.2);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    transition: all 0.3s;
}
.logout-btn:hover {
    background: #ef4444;
    color: #fff;
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
    transform: translateY(-2px);
}

.animated-bg {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1;
}
.animated-bg::before {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: var(--primary-glow);
    top: 40%; left: 75%;
    filter: blur(200px);
    opacity: 0.05;
}

/* ==========================================================================
   حاوية لوحة التحكم في الاستعلام والمدخلات
   ========================================================================== */
.search-container {
    max-width: 1000px;
    margin: 140px auto 60px;
    padding: 0 20px;
    z-index: 10;
    position: relative;
}

.search-panel {
    background: rgba(10, 15, 26, 0.6);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    margin-bottom: 40px;
}

.panel-header {
    text-align: center;
    margin-bottom: 30px;
}
.panel-icon {
    font-size: 2rem;
    color: var(--primary-glow);
    margin-bottom: 12px;
    text-shadow: 0 0 15px rgba(5, 150, 105, 0.3);
}
.panel-header h2 {
    color: #fff;
    font-size: 1.5rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
}
.panel-header p {
    color: var(--text-muted);
    font-size: 0.8rem;
}

.input-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 25px;
}
.input-group label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 10px;
    text-transform: uppercase;
}
.input-group input {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    padding: 16px;
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.3s ease;
}
.input-group input:focus {
    border-color: var(--primary-glow);
    background: rgba(5, 150, 105, 0.03);
    box-shadow: 0 0 15px rgba(5, 150, 105, 0.2);
}

/* أزرار الراديو المحدثة */
.radio-group-wrapper {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 30px;
}
.radio-cyber {
    flex: 1;
    min-width: 100px;
    cursor: pointer;
}
.radio-cyber input { display: none; }
.radio-tile {
    display: block;
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid var(--glass-border);
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    transition: all 0.3s;
}
.radio-cyber input:checked + .radio-tile {
    border-color: var(--secondary-glow);
    background: rgba(251, 191, 36, 0.04);
    color: var(--secondary-glow);
    box-shadow: 0 0 15px rgba(251, 191, 36, 0.1);
}

.btn-search {
    width: 100%;
    padding: 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    background: var(--primary-glow);
    color: #000;
    border: 1px solid var(--primary-glow);
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}
.btn-search:hover {
    box-shadow: 0 0 30px rgba(5, 150, 105, 0.4);
    transform: translateY(-2px);
}

/* -------------------- رسائل التنبيهات والأخطاء -------------------- */
.alert {
    padding: 15px 20px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 25px;
    display: none;
}
.alert.error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    color: #f87171;
    display: block;
}
.alert.success {
    background: rgba(5, 150, 105, 0.1);
    border: 1px solid rgba(5, 150, 105, 0.2);
    color: #4ade80;
    display: block;
}

/* ==========================================================================
   نتائج الاستعلام وشبكة العرض المتجاوبة
   ========================================================================== */
.results-section {
    margin-bottom: 40px;
}
.results-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--glass-border);
    padding-bottom: 15px;
    margin-bottom: 25px;
}
.results-header h3 {
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    text-transform: uppercase;
}
.stats-badge {
    font-size: 0.75rem;
    color: var(--secondary-glow);
    background: rgba(251, 191, 36, 0.05);
    padding: 4px 12px;
    border-radius: 50px;
    border: 1px solid rgba(251, 191, 36, 0.15);
}

/* شبكة الكروت المتجاوبة المرنة */
.results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
}

.no-results-msg, .no-history-text {
    color: var(--text-muted);
    font-size: 0.85rem;
    grid-column: 1 / -1;
    text-align: center;
    padding: 20px;
}

/* الكروت المبنية ديناميكياً بواسطة جافا سكريبت */
.cyber-book-card {
    background: rgba(10, 15, 26, 0.45);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    transition: all 0.3s ease;
}
.cyber-book-card:hover {
    border-color: rgba(5, 150, 105, 0.25);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    transform: translateY(-4px);
}

.book-cover-frame {
    width: 100%;
    height: 180px;
    border-radius: 6px;
    overflow: hidden;
    background: rgba(0,0,0,0.3);
}
.book-cover-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.book-info-block h4 {
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 10px;
    line-height: 1.4;
}
.info-tag {
    display: block;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 6px;
}
.info-tag i { color: var(--primary-glow); margin-right: 8px; }

.status-wrapper { margin-top: 8px; }
.status-indicator {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 4px;
}
.badge-available {
    background: rgba(5, 150, 105, 0.08);
    color: #4ade80;
    border: 1px solid rgba(5, 150, 105, 0.2);
}
.badge-borrowed {
    background: rgba(239, 68, 68, 0.08);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.2);
}

.btn-view-details {
    width: 100%;
    background: transparent;
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    padding: 12px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
.cyber-book-card:hover .btn-view-details {
    background: rgba(255, 255, 255, 0.03);
    border-color: rgba(255,255,255,0.2);
    color: #fff;
}

/* ==========================================================================
   سجل البحث الأخير (Recent Queries History)
   ========================================================================== */
.history-panel {
    background: rgba(10, 15, 26, 0.3);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 25px;
    margin-top: 30px;
}
.history-panel h4 {
    font-size: 0.85rem;
    text-transform: uppercase;
    color: var(--text-main);
    margin-bottom: 15px;
    letter-spacing: 0.5px;
}
.history-panel h4 i { color: var(--secondary-glow); }

.history-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
.history-tag {
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid var(--glass-border);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.75rem;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
}
.history-tag:hover {
    background: rgba(5, 150, 105, 0.03);
    border-color: rgba(5, 150, 105, 0.3);
    color: var(--primary-glow);
}
.history-type-label {
    font-size: 0.65rem;
    color: var(--secondary-glow);
    background: rgba(251, 191, 36, 0.05);
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 4px;
}

/* إلغاء القوائم والخطوط القديمة المهملة في التحديث */
hr, .bottom-links { display: none; }

/* ==========================================================================
   التجاوب مع الشاشات الصغيرة (Responsive Design)
   ========================================================================== */
@media (max-width: 768px) {
    .glass-nav {
        padding: 15px 20px;
    }
    .nav-menu { gap: 5px; }
    .nav-link { padding: 8px 10px; font-size: 0.75rem; }
    
    .search-container { margin-top: 130px; }
    .search-panel { padding: 25px; }
    .radio-group-wrapper { flex-direction: column; gap: 8px; }
    
    .results-grid {
        grid-template-columns: 1fr;
    }
}
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="animated-bg"></div>

    <nav class="glass-nav">
        <h2 class="logo"><i class="fas fa-terminal"></i> BookNest <span class="brand-accent">Core</span></h2>
        <ul class="nav-menu">
            <li><a class="nav-link" href="{% url 'user_home' %}"><i class="fas fa-cubes"></i> Home</a></li>
            <li><a class="nav-link active" href="{% url 'search' %}"><i class="fas fa-search"></i> Search Books</a></li>
            <li><a class="nav-link" href="{% url 'borrowed_books' %}"><i class="fas fa-book-bookmark"></i> Borrowed</a></li>
            <li>
                <form method="POST" action="{% url 'logout' %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn"><i class="fas fa-power-off"></i> Log Out</button>
                </form>
            </li>
        </ul>
    </nav>

    <main class="search-container">
        
        <div id="alertMessage" class="alert"></div>

        <div class="search-panel">
            <div class="panel-header">
                <i class="fas fa-search-location panel-icon"></i>
                <h2>Query Engine</h2>
                <p>Filter the local library index by Title, Author, or Category parameter fields.</p>
            </div>

            <form id="searchForm" class="cyber-form">
                <div class="input-group">
                    <label for="searchInput">Search Parameters</label>
                    <input type="text" id="searchInput" placeholder="Enter key terms or data records...">
                </div>

                <div class="radio-group-wrapper">
                    <label class="radio-cyber">
                        <input type="radio" name="search_by" checked>
                        <span class="radio-tile">All Filters</span>
                    </label>
                    <label class="radio-cyber">
                        <input type="radio" name="search_by">
                        <span class="radio-tile">Title</span>
                    </label>
                    <label class="radio-cyber">
                        <input type="radio" name="search_by">
                        <span class="radio-tile">Author</span>
                    </label>
                    <label class="radio-cyber">
                        <input type="radio" name="search_by">
                        <span class="radio-tile">Category</span>
                    </label>
                </div>

                <button type="submit" class="btn-search">
                    <i class="fas fa-satellite-dish"></i> Execute Query
                </button>
            </form>
        </div>

        <section class="results-section">
            <div class="results-header">
                <h3>Query Output</h3>
                <div id="searchStats" class="stats-badge"></div>
            </div>
            <div id="resultsContainer" class="results-grid"></div>
        </section>


    </main>

    <script src="{% static 'search.js' %}?v=2"></script>
    <script src="{% static 'authScript.js' %}"></script>
</body>
</html>
