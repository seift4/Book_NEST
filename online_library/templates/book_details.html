{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Book Details</title>
        <link href="https://googleapis.com" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'bookstyle.css' %}">
    </head>

    <body>
<nav>
    <h2 class="logo">📚 BookNest Library</h2>
    
    <ul>
 
    <a class="nav-link" href="{% url 'user_home' %}"><li>Home</li></a> 
    <a class="nav-link" href="{% url 'search' %}"><li>Search Books</li></a> 
    <a class="nav-link" href="{% url 'borrowed_books' %}"><li>Borrowed Books</li></a> 
    <a class="nav-link out" href="#" onclick="logout()">Logout</a>
  </ul>
    <hr>
</nav>

        <h1> <ins> Book Information </ins> </h1>

        <br>
        
        <table>
            <tr>
                <th>Book Title:</th>
                <td id="bookTitle"></td>
            </tr>

            <tr>
                <th>Book Cover:</th>
                <td> 
                    <img id="bookCover" alt="Book cover" height="250">
                </td>
            </tr>

            <tr>
                <th>Author:</th>
                <td id="bookAuthor"></td>
            </tr>

            <tr>
                <th>Category:</th>
                <td id="bookCategory"></td>
            </tr>

            <tr>
                <th>Status:</th>
                <td id="bookStatus"><b></b></td>
            </tr>

            <tr>
                <th>Description:</th>
                <td>
                    <p id="bookDescription"></p>
                </td>
            </tr>
        </table>

        <br>

        <button type="button" id="borrowBtn"> Borrow This Book </button>

        <br><br> 
        <hr>
        <br><br> 


        <script src="{% static 'search.js' %}"></script>
        <script src="{% static 'book_details.js' %}"></script>
        <script src="{% static 'authScript.js' %}"></script>
    </body>
</html>
