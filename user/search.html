<!DOCTYPE html>
<html>
<head>
    <title>Search Books - BookNest Library</title>
    <link rel="stylesheet" href="search style.css">
</head>
<body>

    <!-- Navigation Bar -->
<nav>
    <h2 class="logo">📚 BookNest Library</h2>
    
    <ul>
 
    <a class="nav-link" href="user_home.html"><li>Home</li></a> 
    <a class="nav-link" href="search.html"><li>Search Books</li></a> 
    <a class="nav-link" href="book_details.html"><li> Books details</li></a> 
    <a class="nav-link" href="borrowed_books.html"><li>Borrowed Books</li></a> 

  </ul>
    <hr>
</nav>

    <!-- Page Title -->
    <h2>🔍 Search for Books</h2>

    <!-- Alert Area -->
    <div id="alertMessage" class="alert"></div>

    <!-- Search Form -->
    <form id="searchForm">
        <label>Search by Title, Author, or Category:</label><br>
        <input type="text" id="searchInput" placeholder="Enter your search..."><br>

        <label>
            <input type="radio" name="search_by" checked> All
        </label>
        <label>
            <input type="radio" name="search_by"> Title
        </label>
        <label>
            <input type="radio" name="search_by"> Author
        </label>
        <label>
            <input type="radio" name="search_by"> Category
        </label>

        <br>
        <button type="submit">🔎 Search</button>
    </form>

    <!-- Results Section -->
    <h3>Search Results:</h3>
    <div id="searchStats"></div>
    <div id="resultsContainer" class="results-container"></div>

    <!-- Search History -->
    <div class="search-history">
        <h4>📜 Recent Searches</h4>
        <div id="historyList"></div>
    </div>

    <!-- Bottom Links -->
    <div class="bottom-links">
        <a href="borrowed_books.html">📖 View My Borrowed Books</a>
        <br><br>
        <a href="login.html">🚪 Logout</a>
    </div>

    <script src="search.js"></script>

</body>
</html>
